# azure-pipelines.yml
#
# Azure Pipelines CI configuration for OffScript.
# Runs in parallel with GitHub Actions (.github/workflows/ci.yml).
# Triggered on every push to main and on pull requests.
# Uses a self-hosted Windows agent with Anaconda Python 3.11.
#
# Pipeline stages:
#   1. Test  — installs dependencies and runs pytest suite
#   2. Docker — builds and tags the Docker image on test success

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  name: Default

variables:
  TESTING: 'true'
  CI: 'true'

stages:

  # ── Stage 1: Test ──────────────────────────────────────────────────────
  # Installs Python dependencies and runs the full pytest suite.
  # Test results are published to Azure DevOps for visual reporting.
  - stage: Test
    displayName: Run Tests
    jobs:
      - job: pytest
        displayName: pytest — API endpoint coverage
        steps:

          - script: |
              python --version
              pip --version
            displayName: Verify Python environment

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements-api.txt
            displayName: Install dependencies

          - script: |
              if not exist "data\processed" mkdir data\processed
              if not exist "models" mkdir models
            displayName: Create required directories

          - script: |
              pytest api/tests/ -v --tb=short --junitxml=test-results.xml
            displayName: Run pytest suite
            env:
              TESTING: $(TESTING)
              CI: $(CI)

          - task: PublishTestResults@2
            displayName: Publish test results to Azure DevOps
            condition: always()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: test-results.xml
              testRunTitle: OffScript API Tests

  # ── Stage 2: Docker Build ──────────────────────────────────────────────
  # Builds the Docker image only after tests pass.
  # Tags the image with both the build ID for traceability and
  # latest for convenience. Uses direct Docker CLI to avoid
  # file write warnings from the Docker@2 task on Windows agents.
  - stage: Docker
    displayName: Build Docker Image
    dependsOn: Test
    condition: succeeded()
    jobs:
      - job: docker_build
        displayName: Build and verify Docker image
        steps:

          - script: |
              docker build -t offscript-api:$(Build.BuildId) -t offscript-api:latest .
              docker images offscript-api
            displayName: Build and verify Docker image