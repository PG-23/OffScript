# docker-compose.yml

services:
  offscript-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: offscript-api
    ports:
      - "8000:8000"
    volumes:
      # Mount local data and models into the container at runtime
      # This avoids baking large data files into the image
      - ./data/processed:/app/data/processed:ro
      - ./models:/app/models:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", 
             "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  prometheus:
    image: prom/prometheus:latest
    container_name: offscript-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    depends_on:
      - offscript-api

  grafana:
    image: grafana/grafana:latest
    container_name: offscript-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=offscript
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    depends_on:
      - prometheus

  # Optional: Add a simple test runner service
  offscript-tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: offscript-tests
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./models:/app/models:ro
      - ./api/tests:/app/api/tests:ro
    command: ["pytest", "api/tests/", "-v"]
    profiles:
      - test

volumes:
  prometheus_data:
  grafana_data: