# ── k8s/service.yml ───────────────────────────────────────────────────────
# Exposes the deployment externally via a LoadBalancer on port 80.
# Traffic on port 80 is forwarded to containerPort 8000 on the pods.
apiVersion: v1
kind: Service
metadata:
  name: offscript-service
  namespace: offscript
  labels:
    app: offscript-api
spec:
  selector:
    app: offscript-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer