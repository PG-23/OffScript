# ── k8s/configmap.yml ─────────────────────────────────────────────────────
# Non-sensitive environment variables injected into the API container.
# Sensitive values (API keys, secrets) should use Kubernetes Secrets instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: offscript-config
  namespace: offscript
data:
  PYTHONUNBUFFERED: "1"
  API_VERSION: "1.0.0"
  LOG_LEVEL: "info"
  TESTING: "false"